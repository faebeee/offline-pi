# Container images of outpost, so a Pi downloads them instead of building
# them (10-30 minutes there). Every push to main and every release tag
# publishes ghcr.io/<owner>/outpost-<service> for amd64 and arm64:
#
#   :sha-<7 chars>   every commit; install/start/update pull the one that
#                    matches the checkout (lib/images.sh)
#   :main            the newest commit on main
#   :<version>, :latest   release tags v<version>, then the GitHub Release
#                    (job "release", text from docs/07-changelog.md)
#
# Built with Podman/Buildah (AGENTS.md: no Docker), each architecture on a
# native runner (no emulation), then joined into one multi-arch manifest.
# The images must be public: GitHub > Packages > outpost-<service> > Package
# settings > Change visibility (once per image, after its first push).
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service: [core, maps, knowledge, network]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Podman
        run: command -v podman || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
      - name: Image name
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/outpost-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          podman build --platform linux/${{ matrix.arch }} \
            -f apps/${{ matrix.service }}/Dockerfile \
            -t "${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}-${{ matrix.arch }}" .
      - name: Push
        run: podman push "${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [core, maps, knowledge, network]
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Join the architectures and tag
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/outpost-${{ matrix.service }}"
          sha="sha-${GITHUB_SHA::7}"
          tags=("$sha")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(main); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=("${GITHUB_REF#refs/tags/v}" latest); fi
          podman manifest create "$image:$sha"
          for arch in amd64 arm64; do
            podman manifest add "$image:$sha" "docker://$image:$sha-$arch"
          done
          for tag in "${tags[@]}"; do
            podman manifest push --all "$image:$sha" "docker://$image:$tag"
          done

  # A release tag v<version>: once its images are published (above), the
  # GitHub Release, whose text is the version's changelog section. Pis find
  # it through core's update check (/releases/latest) and ./update.sh
  # installs the tag.
  release:
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          # 0.3.0-rc.1: a pre-release, skipped by /releases/latest
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "outpost $version" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "outpost $version" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
