services:
  mesh:
    build: .
    image: offline-pi-mesh
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8084}:8084"
    environment:
      MESH_CONNECTION: ${MESH_CONNECTION:-serial}
      MESH_HOST: ${MESH_HOST:-}
      SEND_PIN: ${SEND_PIN:-}
      SEND_RATE_LIMIT: ${SEND_RATE_LIMIT:-5/min}
      MAPS_PORT: ${MAPS_PORT:-8081}
      MESH_MAP_PORT: ${MESH_MAP_PORT:-8086}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    devices:
      # The USB node (install.sh writes its stable /dev/serial/by-id/ path).
      # Podman resolves the device when the container is created, so the node
      # must be plugged in when the app starts; /dev/null when MESH_CONNECTION=tcp.
      - ${MESH_DEVICE:-/dev/ttyACM0}:/dev/meshtastic
    group_add:
      # keep the host user's supplementary groups (dialout -> serial device)
      - keep-groups
    restart: always
    healthcheck:
      # CMD-SHELL string rather than a CMD array: podman-compose re-quotes CMD
      # arrays into a broken shell command. Checks the web server, not the
      # radio, so an unplugged node doesn't restart-loop the container.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/api/status', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
