<!doctype html>
<html lang="en" class="t-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mesh</title>
  <script src="/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="/ui/outpost.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame" id="frame" data-pane="list" data-view="chats">
    <div data-strip></div>

    <header class="header">
      <button type="button" id="back" class="btn btn-icon back" aria-label="Back to conversations" hidden></button>
      <div class="header-title">
        <span class="label" data-module-label>Module 03 · Mesh</span>
        <h1 class="h1" id="title">Messages</h1>
      </div>
      <div class="header-actions">
        <button data-theme-toggle></button>
      </div>
    </header>

    <div class="context" id="context" hidden></div>

    <div class="pinned" id="pinned" hidden></div>

    <div class="frame-body">
      <main class="content bleed mesh-main">
        <div class="tabs" role="tablist" aria-label="Views">
          <button type="button" class="tab" role="tab" id="tab-chats" data-view="chats" aria-controls="view-chats" aria-selected="true">Messages <span id="unread-total" class="tab-count"></span></button>
          <button type="button" class="tab" role="tab" id="tab-nodes" data-view="nodes" aria-controls="view-nodes" aria-selected="false">Nodes <span id="node-count" class="tab-count"></span></button>
        </div>

        <section id="view-chats" class="chats" role="tabpanel" aria-labelledby="tab-chats">
          <nav class="conv-pane grid-bg" aria-label="Conversations">
            <ul id="conv-list" class="list conv-list"></ul>
          </nav>

          <section class="thread" aria-label="Messages">
            <div id="messages" class="messages grid-bg">
              <p id="thread-sub" class="thread-sub label"></p>
              <button type="button" id="older" class="btn btn-ghost btn-sm older" hidden>Load older messages</button>
              <ol id="message-list" class="chat" aria-live="polite" aria-relevant="additions"></ol>
              <div id="empty" class="empty" hidden></div>
            </div>
            <p id="composer-note" class="composer-note" hidden></p>
            <form id="composer" class="composer" autocomplete="off">
              <div class="composer-field">
                <textarea id="text" class="textarea" rows="1" placeholder="Message" aria-label="Message" aria-describedby="bytes composer-note" disabled></textarea>
                <span id="bytes" class="counter" aria-live="off">0/200 B</span>
              </div>
              <button type="submit" id="send" class="btn btn-primary btn-send" aria-label="Send" disabled></button>
            </form>
          </section>
        </section>

        <section id="view-nodes" class="nodes grid-bg" role="tabpanel" aria-labelledby="tab-nodes" hidden>
          <ul id="node-list" class="list node-list"></ul>
          <div id="nodes-empty" class="empty" hidden></div>
        </section>
      </main>
      <nav data-nav></nav>
    </div>
  </div>

  <dialog id="pin-dialog" class="dialog" aria-labelledby="pin-title">
    <form method="dialog" id="pin-form">
      <div class="dialog-head">
        <h2 class="h2" id="pin-title">PIN required</h2>
      </div>
      <div class="dialog-body">
        <p class="body-sm fg2">Sending from this Pi is protected by a PIN.</p>
        <div class="field" id="pin-field">
          <label class="label" for="pin-input">Send PIN</label>
          <input id="pin-input" class="input mono" type="password" inputmode="numeric" autocomplete="off" required>
          <p id="pin-error" class="field-error" hidden></p>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" value="cancel" id="pin-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" value="ok" class="btn btn-primary">Send</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
