services:
  offline-maps:
    build: .
    image: offline-maps
    # The image runs as `node` (uid 1000). Under rootless Podman that uid would
    # otherwise map to an unprivileged sub-uid on the host and couldn't write to
    # the bind-mounted DATA_DIR/ASSETS_DIR; keep-id maps the host user onto it.
    userns_mode: "keep-id:uid=1000,gid=1000"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # extra origins allowed to call /api, e.g. http://maps.local:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # unset -> sqlite at $DATA_DIR/offline-maps.db; set to move POIs to Postgres,
      # e.g. postgres://maps:secret@db:5432/maps
      DATABASE_URL: ${DATABASE_URL:-}
      # true logs every SQL statement (debugging only)
      DB_LOGGING: ${DB_LOGGING:-false}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${ASSETS_DIR:-./assets}:/app/assets
    restart: always
    healthcheck:
      # CMD-SHELL string rather than a CMD array: podman-compose re-quotes CMD
      # arrays into a broken shell command ("Syntax error: ( unexpected").
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/status').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# userns_mode (keep-id) cannot be combined with a pod, so podman-compose must
# run the service without one.
x-podman:
  in_pod: false
