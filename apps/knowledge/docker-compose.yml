services:
  kiwix-serve:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: offline-knowledge-kiwix
    restart: unless-stopped
    ports:
      - "${KIWIX_PORT:-8080}:8080"
    volumes:
      - ${CONTENT_DIR:-./data}:/data
    command: ["-k", "-i", "${BIND_ADDRESS:-all}", "/data/zim/*.zim"]
