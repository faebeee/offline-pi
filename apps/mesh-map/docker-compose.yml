services:
  mesh-map:
    build: .
    image: offline-pi-mesh-map
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8086}:8086"
    environment:
      # apps/mesh on this host; the browser reads its node list directly
      MESH_PORT: ${MESH_PORT:-8084}
    volumes:
      # apps/maps' DATA_DIR and ASSETS_DIR, read-only: region archives
      # (regions.json + regions/*.pmtiles), fonts and sprites. mesh-map never
      # writes there and doesn't need apps/maps to be running.
      - ${MAPS_DATA_DIR:-../maps/data}:/maps/data:ro
      - ${MAPS_ASSETS_DIR:-../maps/assets}:/maps/assets:ro
    restart: always
    healthcheck:
      # CMD-SHELL string rather than a CMD array: podman-compose re-quotes CMD
      # arrays into a broken shell command.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8086/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
