# compose.macos.yml - added to compose.yml on macOS (lib/common.sh, compose).
#
# On a Mac, Podman runs the containers in a VM and podman-compose talks to it
# through the remote API, which rejects `--group-add keep-groups`. The groups
# are only needed for Raspberry Pi devices (firmware mailbox, USB serial),
# which don't exist on a Mac anyway.
services:
  core:
    group_add: !reset []
  mesh:
    group_add: !reset []
